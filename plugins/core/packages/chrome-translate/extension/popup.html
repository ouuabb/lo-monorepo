<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      width: 280px;
      padding: 16px;
      margin: 0;
      color: #1a1a2e;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    .stat {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }
    .stat-label { color: #666; }
    .stat-value { font-weight: 600; }
    .stat-value.ok { color: #4ecca3; }
    .stat-value.fail { color: #c0392b; }
    .actions { margin-top: 14px; display: flex; gap: 8px; }
    button {
      flex: 1; padding: 6px; font-size: 12px; cursor: pointer;
      background: #16213e; color: #fff; border: none; border-radius: 4px;
    }
    button:hover { background: #0f3460; }
    .endpoint-status {
      margin-top: 10px; padding: 8px; border-radius: 4px;
      font-size: 12px; text-align: center;
    }
    .endpoint-status.ok { background: #e8f5e9; color: #2e7d32; }
    .endpoint-status.warn { background: #fff3e0; color: #e65100; }
  </style>
</head>
<body>
  <h1>lo 划词翻译</h1>

  <div class="stat">
    <span class="stat-label">本地记录</span>
    <span class="stat-value" id="localCount">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">HTTP 推送成功</span>
    <span class="stat-value ok" id="httpSuccess">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">HTTP 跳过(去重)</span>
    <span class="stat-value" id="httpSkipped">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">HTTP 失败</span>
    <span class="stat-value fail" id="httpFail">0</span>
  </div>

  <div class="endpoint-status" id="endpointStatus">加载中...</div>

  <div class="actions">
    <button id="openOptions">设置</button>
    <button id="retryHttp">重试推送</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
